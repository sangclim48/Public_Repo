<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식당 길찾기</title>
<meta property="og:title" content="식당 길찾기">
<meta property="og:description" content="카카오맵 · 네이버지도 · 티맵으로 바로 열기">
<style>
  body { margin: 0; font: 16px/1.5 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #eef3f0; color: #15241b; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 420px; box-sizing: border-box; background: #fff; border-radius: 16px; padding: 24px 20px; text-align: center; box-shadow: 0 8px 24px -14px rgba(0,0,0,.4); }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.02em; }
  p { margin: 0 0 18px; color: #4a5d53; font-size: 14px; }
  .row { display: flex; justify-content: center; gap: 22px; margin-top: 8px; }
  a.b { display: flex; flex-direction: column; align-items: center; gap: 6px; text-decoration: none; color: #15241b; font-size: 13px; font-weight: 700; }
  a.b i { display: grid; place-items: center; width: 64px; height: 64px; border-radius: 50%; }
  a.kakao i { background: #fee500; color: #3a1d1d; }
  a.naver i { background: #03c75a; color: #fff; }
  a.tmap i { background: #ef4136; color: #fff; }
  svg { width: 30px; height: 30px; }
</style>
</head>
<body>
<main>
  <h1 id="name">식당</h1>
  <p id="area"></p>
  <div class="row">
    <a class="b kakao" id="kakao" href="#"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></i>카카오맵</a>
    <a class="b naver" id="naver" href="#"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a7 7 0 0 0-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></i>네이버지도</a>
    <a class="b tmap" id="tmap" href="#"><i><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2 4.5 21.3 12 17.5l7.5 3.8z"/></svg></i>티맵</a>
  </div>
</main>
<script>
  // 사용법: r.html?n=식당이름&a=시군(선택)&k=카카오맵장소번호&x=경도&y=위도
  var q = new URLSearchParams(location.search);
  var n = q.get('n') || '식당', a = q.get('a') || '', k = q.get('k'), x = q.get('x'), y = q.get('y');
  document.getElementById('name').textContent = n;
  document.getElementById('area').textContent = a;
  document.getElementById('kakao').href = k ? 'https://place.map.kakao.com/' + encodeURIComponent(k) : 'https://map.kakao.com/?q=' + encodeURIComponent(a + ' ' + n);
  document.getElementById('naver').href = 'https://map.naver.com/p/search/' + encodeURIComponent((a + ' ' + n).trim());
  var android = /Android/i.test(navigator.userAgent), pkg = 'com.skt.tmap.ku';
  var params = 'goalname=' + encodeURIComponent(n) + '&goalx=' + encodeURIComponent(x) + '&goaly=' + encodeURIComponent(y);
  var t = document.getElementById('tmap');
  if (x && y) t.href = android ? 'intent://route?' + params + '#Intent;scheme=tmap;package=' + pkg + ';end' : 'tmap://route?' + params;
  else t.style.display = 'none';
</script>
</body>
</html>
