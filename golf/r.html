<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>식당 길찾기</title>
<meta property="og:title" content="식당 길찾기">
<meta property="og:description" content="카카오맵 · 네이버지도 · 티맵으로 바로 열기">
<style>
  body { margin: 0; font: 16px/1.5 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #eef3f0; color: #15241b; display: grid; place-items: center; min-height: 100vh; }
  main { width: min(92vw, 420px); background: #fff; border-radius: 16px; padding: 24px 20px; text-align: center; box-shadow: 0 8px 24px -14px rgba(0,0,0,.4); }
  h1 { font-size: 22px; margin: 0 0 2px; letter-spacing: -0.02em; }
  p { margin: 0 0 18px; color: #4a5d53; font-size: 14px; }
  a.b { display: block; padding: 14px; border-radius: 12px; font-weight: 800; text-decoration: none; margin-top: 10px; }
  a.kakao { background: #fee500; color: #191919; }
  a.naver { background: #03c75a; color: #fff; }
  a.tmap { background: #ef4136; color: #fff; }
</style>
</head>
<body>
<main>
  <h1 id="name">식당</h1>
  <p id="area"></p>
  <a class="b kakao" id="kakao" href="#">카카오맵으로 보기</a>
  <a class="b naver" id="naver" href="#">네이버지도로 보기</a>
  <a class="b tmap" id="tmap" href="#">티맵으로 길찾기</a>
</main>
<script>
  // 사용법: r.html?n=식당이름&a=시군(선택)&k=카카오맵장소번호&x=경도&y=위도
  var q = new URLSearchParams(location.search);
  var n = q.get('n') || '식당', a = q.get('a') || '', k = q.get('k'), x = q.get('x'), y = q.get('y');
  document.getElementById('name').textContent = n;
  document.getElementById('area').textContent = a;
  document.getElementById('kakao').href = k ? 'https://place.map.kakao.com/' + encodeURIComponent(k) : 'https://map.kakao.com/?q=' + encodeURIComponent(a + ' ' + n);
  document.getElementById('naver').href = 'https://map.naver.com/p/search/' + encodeURIComponent((a + ' ' + n).trim());
  var android = /Android/i.test(navigator.userAgent), pkg = 'com.skt.tmap.ku';
  var params = 'goalname=' + encodeURIComponent(n) + '&goalx=' + encodeURIComponent(x) + '&goaly=' + encodeURIComponent(y);
  var t = document.getElementById('tmap');
  if (x && y) t.href = android ? 'intent://route?' + params + '#Intent;scheme=tmap;package=' + pkg + ';end' : 'tmap://route?' + params;
  else t.style.display = 'none';
</script>
</body>
</html>
