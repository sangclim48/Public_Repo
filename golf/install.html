<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낭만 골프 설치</title>
<meta property="og:title" content="낭만 골프 앱 설치">
<meta property="og:description" content="골프 티타임 가격 비교 · 근처 식당 찾기 (안드로이드)">
<style>
  body { margin: 0; font: 16px/1.6 system-ui, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; background: #edf6f0; color: #15241b; display: flex; justify-content: center; padding: 16px; box-sizing: border-box; }
  main { width: 100%; max-width: 460px; background: #fff; border-radius: 18px; padding: 26px 20px; box-sizing: border-box; box-shadow: 0 8px 24px -14px rgba(0,0,0,.4); }
  h1 { font-size: 24px; margin: 0 0 4px; letter-spacing: -0.02em; }
  .sub { color: #4a5d53; margin: 0 0 20px; font-size: 15px; }
  a.dl { display: block; padding: 16px; border-radius: 14px; background: #03c75a; color: #fff; text-align: center; font-size: 18px; font-weight: 800; text-decoration: none; }
  .size { text-align: center; font-size: 13px; color: #7b8c83; margin-top: 6px; }
  ol { margin: 22px 0 0; padding-left: 22px; font-size: 15px; }
  li + li { margin-top: 10px; }
  .key { margin-top: 18px; padding: 14px; border-radius: 12px; background: #fff7e6; font-size: 14px; color: #6b4a00; }
  .key b { color: #15241b; }
  .mock { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; }
  .btn { padding: 9px 12px; border-radius: 999px; background: #e6e8e7; font-size: 14px; text-align: center; color: #333; }
  .btn.go { background: #fff; border: 3px solid #03c75a; color: #15241b; font-weight: 800; }
  .btn.no { background: #3b82f6; color: #fff; }
  .tag { display: inline-block; margin-left: 4px; padding: 0 6px; border-radius: 6px; font-size: 11px; font-weight: 800; vertical-align: 1px; }
  .tag.ok { background: #03c75a; color: #fff; }
  .tag.x { background: #ef4136; color: #fff; }
  .note { margin-top: 16px; font-size: 12px; color: #7b8c83; }
</style>
</head>
<body>
<main>
  <h1>낭만 골프</h1>
  <p class="sub">골프 티타임 가격 비교 · 근처 식당 찾기</p>
  <a class="dl" href="https://sangclim48.github.io/Public_Repo/%EB%82%AD%EB%A7%8C%EA%B3%A8%ED%94%84.apk">앱 내려받기 (안드로이드)</a>
  <div class="size">약 8MB</div>

  <ol>
    <li>위 버튼으로 내려받고, 파일을 엽니다.</li>
    <li>"출처를 알 수 없는 앱"이라고 나오면 <b>설정</b>에서 <b>허용</b>을 켜고 뒤로 갑니다.</li>
    <li>경고 화면이 나오면 <b>"무시하고 설치"</b>를 누릅니다.</li>
  </ol>

  <div class="key">
    스토어에 없는 앱이라 경고가 여러 번 나옵니다. 눈에 띄는 큰 버튼은 <b>취소</b>입니다.
    <div class="mock">
      <div class="btn go">무시하고 설치 <span class="tag ok">이걸 누르세요</span></div>
      <div class="btn no">설치 안 함 · 확인 <span class="tag x">아님</span></div>
    </div>
  </div>

  <div class="note">아이폰은 지원하지 않습니다. 가격은 조회 시점의 값이니 예약 전 각 사이트에서 다시 확인해 주세요.</div>
</main>
</body>
</html>
